<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 31 Tuesday Practice Quiz</title>
    <style>
        /* --- CSS Variables & Themes --- */
        :root {
            /* Base Transition */
            --transition-speed: 0.3s;
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* 1. Modern Dark (Default) */
        [data-theme="dark"] {
            --bg-body: #1e293b;
            --bg-card: #334155;
            --bg-header: #0f172a;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --text-accent: #38bdf8;
            --border-color: #475569;
            --highlight-bg: #475569;
            --button-bg: #38bdf8;
            --button-text: #0f172a;
            --button-hover: #0ea5e9;
            --feedback-success-bg: #064e3b;
            --feedback-success-border: #059669;
            --feedback-success-text: #a7f3d0;
            --feedback-error-bg: #7f1d1d;
            --feedback-error-border: #dc2626;
            --feedback-error-text: #fecaca;
        }

        /* 2. Modern Light */
        [data-theme="light"] {
            --bg-body: #f3f4f6;
            --bg-card: #ffffff;
            --bg-header: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --text-accent: #2563eb;
            --border-color: #e5e7eb;
            --highlight-bg: #f3f4f6;
            --button-bg: #2563eb;
            --button-text: #ffffff;
            --button-hover: #1d4ed8;
            --feedback-success-bg: #ecfdf5;
            --feedback-success-border: #34d399;
            --feedback-success-text: #065f46;
            --feedback-error-bg: #fef2f2;
            --feedback-error-border: #f87171;
            --feedback-error-text: #991b1b;
        }

        /* 3. Midnight (Pure Black) */
        [data-theme="midnight"] {
            --bg-body: #000000;
            --bg-card: #000000;
            --bg-header: #000000;
            --text-main: #e0e0e0;
            --text-muted: #888888;
            --text-accent: #90caf9;
            --border-color: #333333;
            --highlight-bg: #1a1a1a;
            --button-bg: #90caf9;
            --button-text: #000000;
            --button-hover: #42a5f5;
            --feedback-success-bg: #051b11;
            --feedback-success-border: #0f5132;
            --feedback-success-text: #75b798;
            --feedback-error-bg: #2c0b0e;
            --feedback-error-border: #842029;
            --feedback-error-text: #ea868f;
        }

        /* 4. Legacy Dark (Original) */
        [data-theme="legacy-dark"] {
            --bg-body: #2d343e;
            --bg-card: #3c424f;
            --bg-header: #3c424f;
            --text-main: #e8e6e3;
            --text-muted: #b0c4de;
            --text-accent: #8ab4f8;
            --border-color: #555;
            --highlight-bg: #454c5a;
            --button-bg: #8ab4f8;
            --button-text: #202124;
            --button-hover: #a3c5f9;
            --feedback-success-bg: #344e41;
            --feedback-success-border: #52b788;
            --feedback-success-text: #c7f9cc;
            --feedback-error-bg: #5e2129;
            --feedback-error-border: #a4133c;
            --feedback-error-text: #f8d7da;
        }

        /* 5. Sepia (Reading Mode) */
        [data-theme="sepia"] {
            --bg-body: #f4ecd8;
            --bg-card: #fdf6e3;
            --bg-header: #e4d5b7;
            --text-main: #433422;
            --text-muted: #7c6f5a;
            --text-accent: #a05a2c;
            --border-color: #d3c4a5;
            --highlight-bg: #ebe1c9;
            --button-bg: #a05a2c;
            --button-text: #fdf6e3;
            --button-hover: #864822;
            --feedback-success-bg: #e6f4ea;
            --feedback-success-border: #8ab893;
            --feedback-success-text: #2e4c35;
            --feedback-error-bg: #f9e3e3;
            --feedback-error-border: #d48f8f;
            --feedback-error-text: #5c2b2b;
        }

        /* 6. High Contrast */
        [data-theme="contrast"] {
            --bg-body: #000000;
            --bg-card: #000000;
            --bg-header: #000000;
            --text-main: #ffffff;
            --text-muted: #dddddd;
            --text-accent: #ffff00;
            --border-color: #ffffff;
            --highlight-bg: #333333;
            --button-bg: #ffff00;
            --button-text: #000000;
            --button-hover: #e6e600;
            --feedback-success-bg: #000000;
            --feedback-success-border: #00ff00;
            --feedback-success-text: #00ff00;
            --feedback-error-bg: #000000;
            --feedback-error-border: #ff0000;
            --feedback-error-text: #ff0000;
        }

        /* --- Global Reset & Layout --- */
        * { box-sizing: border-box; }
        
        body {
            font-family: var(--font-main);
            margin: 0;
            background-color: var(--bg-body);
            color: var(--text-main);
            transition: background-color var(--transition-speed), color var(--transition-speed);
            line-height: 1.6;
        }

        /* --- Header --- */
        header {
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            /* Default to Sticky */
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        /* Class to remove sticky behavior */
        header.unpinned {
            position: relative;
            box-shadow: none;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        header h1 {
            font-size: 1.25rem;
            margin: 0;
            color: var(--text-accent);
        }

        .controls-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .pin-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 1rem;
            transition: background-color 0.2s;
        }

        .pin-btn:hover {
            background-color: var(--highlight-bg);
        }

        .pin-btn.pin-active {
            color: var(--text-accent);
            border-color: var(--text-accent);
            background-color: rgba(0, 0, 0, 0.1);
        }

        .theme-control {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        select#theme-select {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-card);
            color: var(--text-main);
            cursor: pointer;
            font-family: inherit;
        }

        /* --- Section Navigation --- */
        .section-nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .section-nav button {
            background-color: var(--highlight-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .section-nav button:hover {
            border-color: var(--text-accent);
            color: var(--text-accent);
        }

        /* --- Main Content --- */
        .container {
            max-width: 850px;
            margin: 2rem auto;
            padding: 0 1rem 4rem 1rem;
        }

        .section-header {
            margin-top: 3rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--text-accent);
            color: var(--text-accent);
            font-size: 1.5rem;
            font-weight: 700;
            scroll-margin-top: 140px; /* Offset for sticky header */
        }

        /* --- Question Card --- */
        .question-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
        }

        .lo-box {
            background-color: var(--highlight-bg);
            border-left: 4px solid var(--text-accent);
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-radius: 4px;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-style: italic;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        /* --- Options --- */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-label:hover {
            background-color: var(--highlight-bg);
            border-color: var(--text-muted);
        }

        .option-label input {
            margin-top: 0.3rem;
            margin-right: 1rem;
            accent-color: var(--text-accent);
            transform: scale(1.2);
        }

        /* --- Buttons --- */
        .btn-check {
            margin-top: 1.5rem;
            background-color: var(--button-bg);
            color: var(--button-text);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            font-size: 1rem;
        }

        .btn-check:hover {
            opacity: 0.9;
        }

        /* --- Feedback Area --- */
        .feedback {
            margin-top: 1.5rem;
            padding: 1.5rem;
            border-radius: 8px;
            display: none; /* Hidden by default */
            border: 1px solid transparent;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback.correct {
            background-color: var(--feedback-success-bg);
            border-color: var(--feedback-success-border);
            color: var(--feedback-success-text);
        }

        .feedback.incorrect {
            background-color: var(--feedback-error-bg);
            border-color: var(--feedback-error-border);
            color: var(--feedback-error-text);
        }

        .feedback-header {
            font-weight: 800;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        .rationale {
            margin-top: 1rem;
            font-size: 0.95rem;
        }

        .source {
            display: block;
            margin-top: 1rem;
            font-size: 0.85rem;
            opacity: 0.8;
            font-style: italic;
            border-top: 1px dashed currentColor;
            padding-top: 0.5rem;
        }

        /* --- Mobile Tweaks --- */
        @media (max-width: 600px) {
            .header-top { flex-direction: column; gap: 10px; align-items: flex-start; }
            .controls-wrapper { width: 100%; justify-content: space-between; }
            .question-card { padding: 1.5rem; }
            header h1 { font-size: 1.1rem; }
            .section-nav { justify-content: center; }
        }
    </style>
</head>
<body>

    <header id="main-header">
        <div class="header-top">
            <h1>Week 31 Tuesday Practice Quiz</h1>
            <div class="controls-wrapper">
                <!-- Pin Button -->
                <button class="pin-btn pin-active" id="pin-btn" onclick="toggleHeader()" title="Pin/Unpin Header">
                    📍
                </button>
                
                <div class="theme-control">
                    <label for="theme-select">Theme:</label>
                    <select id="theme-select" onchange="changeTheme(this.value)">
                        <option value="dark">Modern Dark</option>
                        <option value="midnight">Midnight</option>
                        <option value="light">Modern Light</option>
                        <option value="legacy-dark">Legacy Dark</option>
                        <option value="sepia">Sepia</option>
                        <option value="contrast">High Contrast</option>
                    </select>
                </div>
            </div>
        </div>
        <!-- Dynamic Navigation Bar injected via JS -->
        <div class="section-nav" id="section-nav"></div>
    </header>

    <div class="container" id="quiz-root">
        <!-- Content injected via JS -->
    </div>

    <script>
        // --- Data ---
        const quizData = [
            // --- Section 1: Pulmonary Hypertension ---
            {
                section: "Pulmonary Hypertension",
                maskedLO: "LO1: Understand the vascular components and their functional role in the [specific circulation].",
                fullLO: "LO1: Understand the vascular components and their functional role in the pulmonary circulation",
                question: "A 45-year-old man undergoes right heart catheterization. The physician measures pressures across different segments of the pulmonary vascular bed to calculate resistance. Compared to the systemic circulation where resistance is predominantly determined by muscular arterioles, the resistance in the normal pulmonary circulation is distributed differently. Which of the following best describes the distribution of vascular resistance in the pulmonary system?",
                options: {
                    A: "Concentrated mainly in the pulmonary veins",
                    B: "Concentrated mainly in the small muscular pulmonary arteries",
                    C: "Determined primarily by pre-capillary sphincters",
                    D: "Distributed equally across arteries, capillaries, and veins",
                    E: "Localized to the transitional arteries"
                },
                correctAnswer: "D",
                rationale: "In the systemic (aortic) circulation, vascular resistance is predominantly dictated by muscular arterioles. However, in the pulmonary system, the resistance is low and is distributed equally across the arteries, capillaries, and veins.",
                source: "Pulmonary Hypertension PDF, Slide 3: \"Distribution of resistance: Equal across arteries, capillaries and veins\""
            },
            {
                section: "Pulmonary Hypertension",
                maskedLO: "LO1: Understand the vascular components and their functional role in the [specific circulation].",
                fullLO: "LO1: Understand the vascular components and their functional role in the pulmonary circulation",
                question: "A researcher is studying the histological features of the pulmonary vascular tree in a healthy animal model. She isolates a specific segment of the pulmonary vasculature that is primarily responsible for generating vascular reactivity in response to alveolar hypoxia. Which of the following vascular components was most likely isolated?",
                options: {
                    A: "Capillaries",
                    B: "Elastic arteries",
                    C: "Muscular arteries",
                    D: "Non-muscular arterioles",
                    E: "Pulmonary veins"
                },
                correctAnswer: "C",
                rationale: "Within the pulmonary vascular tree, the muscular arteries are invested with smooth muscle cells that allow them to generate vascular reactivity, such as constricting in response to hypoxia or endothelin.",
                source: "Pulmonary Hypertension PDF, Slide 14: \"Muscular arteries, invested with smooth muscle cells that generate vascular reactivity (eg. in response to hypoxia, endothelin etc)\""
            },
            {
                section: "Pulmonary Hypertension",
                maskedLO: "LO2: Recognize the different classes of [condition].",
                fullLO: "LO2: Recognize the different classes of PH",
                question: "A 68-year-old man presents with progressive dyspnea on exertion. Echocardiography reveals a reduced left ventricular ejection fraction of 35% and severe mitral regurgitation. Right heart catheterization shows a mean pulmonary artery pressure of 32 mmHg and a pulmonary capillary wedge pressure of 22 mmHg. According to the clinical classification of pulmonary hypertension, this patient's condition belongs to which of the following classes?",
                options: {
                    A: "Class 1",
                    B: "Class 2",
                    C: "Class 3",
                    D: "Class 4",
                    E: "Class 5"
                },
                correctAnswer: "B",
                rationale: "This patient has post-capillary pulmonary hypertension caused by left heart disease (heart failure with reduced ejection fraction and valve disease). This falls under Class 2 PH. Hemodynamically, it is characterized by a mean pulmonary artery pressure >20 mmHg and a pulmonary capillary wedge pressure >15 mmHg.",
                source: "Pulmonary Hypertension PDF, Slide 8: \"Class 2: PH due to left heart disease. Examples: Heart failure with preserved or reduced LV ejection fraction, valve disease...\""
            },
            {
                section: "Pulmonary Hypertension",
                maskedLO: "LO2: Recognize the different classes of [condition].",
                fullLO: "LO2: Recognize the different classes of PH",
                question: "A 32-year-old woman with a history of systemic sclerosis presents with worsening fatigue and exertional dyspnea. Right heart catheterization demonstrates a mean pulmonary artery pressure of 28 mmHg, a pulmonary capillary wedge pressure of 10 mmHg, and a pulmonary vascular resistance of 5 Wood units. Based on these hemodynamic findings, this patient's condition is best classified as which of the following?",
                options: {
                    A: "Combined post-capillary and pre-capillary pulmonary hypertension",
                    B: "Isolated post-capillary pulmonary hypertension",
                    C: "Pulmonary arterial hypertension (Class 1)",
                    D: "Pulmonary hypertension due to lung disease (Class 3)",
                    E: "Pulmonary hypertension due to pulmonary artery obstruction (Class 4)"
                },
                correctAnswer: "C",
                rationale: "This patient has isolated pre-capillary pulmonary hypertension (mPAP > 20, PAWP &le; 15, PVR &ge; 3), which corresponds to Class 1 Pulmonary Arterial Hypertension (PAH). Connective tissue disease is a known cause of Class 1 PAH.",
                source: "Pulmonary Hypertension PDF, Slides 8 & 9: \"Isolated precapillary PH (PAH) [Class] 1, 3, 4 and 5... Mean Pulmonary Artery Pressure >20, Pulmonary Capillary Wedge Pressure &le;15, Pulmonary Vascular Resistance &ge;3\" and \"Class 1: Pulmonary arterial hypertension, PAH... Connective tissue disease.\""
            },
            {
                section: "Pulmonary Hypertension",
                maskedLO: "LO3: Understand the pathophysiological basis of [condition], challenges in diagnosis.",
                fullLO: "LO3: Understand the pathophysiological basis of PH, challenges in diagnosis",
                question: "A 40-year-old woman with long-standing, severe idiopathic pulmonary arterial hypertension dies suddenly. Autopsy reveals extensive remodeling of the pulmonary vasculature. Examination of the heart is most likely to show which of the following gross anatomical changes as a maladaptive response to her chronic disease?",

                    A: "Aortic root dilation",
                    B: "Left atrial dilation",
                    C: "Left ventricular hypertrophy",
                    D: "Mitral valve prolapse",
                    E: "Right ventricular hypertrophy"
                },
                correctAnswer: "E",
                rationale: "The right ventricle is normally structured for a low-resistance environment. In the setting of pulmonary hypertension, the increased workload leads to right ventricular hypertrophy, which is progressive and can eventually result in right ventricular failure and death (cor pulmonale).",
                source: "Pulmonary Hypertension PDF, Slide 21: \"Right Ventricle Hypertrophy... Compared to the LV, the RV has a structure best suited for a low resistance environment (low workload), remodeling can be maladaptive... Without treatment, PH can lead to, RV failure and death (Cor Pulmonale)\""
            },
            {
                section: "Pulmonary Hypertension",

                    D: "Transthoracic echocardiography",

                correctAnswer: "C",
                rationale: "While tests like transthoracic echocardiography are important non-invasive screening tools, a right heart catheterization (RHC) is mandatory to confirm the diagnosis of pulmonary hypertension and to fully characterize the hemodynamics.",
                source: "Pulmonary Hypertension PDF, Slide 24: \"Right heart catheterization (RHC): Mandatory for diagnosis of PH\""
            },

            // --- Section 2: ARDS & Neonatal Respiratory Distress Syndrome ---

                section: "ARDS & Neonatal Respiratory Distress Syndrome",
                maskedLO: "LO1: Define the [specific respiratory] syndromes.",

                correctAnswer: "A",
                rationale: "ARDS is defined as an acute, diffuse, inflammatory disorder characterized by increased pulmonary vascular and epithelial permeability, lung edema, and surfactant inactivation leading to hypoxemia and bilateral opacities. Option E describes neonatal RDS, not adult ARDS.",

            {

                    D: "Immature lungs with surfactant deficiency preventing optimal gas exchange",

                correctAnswer: "D",
                rationale: "Neonatal RDS is primarily caused by structural immaturity of the lungs combined with a deficiency of surfactant, which prevents optimal gas exchange. This is fundamentally different from ARDS, which is an acute inflammatory injury.",

            {
                section: "ARDS & Neonatal Respiratory Distress Syndrome",

                correctAnswer: "A",
                rationale: "Risk factors for neonatal RDS include prematurity, multifetal gestation, gestational diabetes, and rare genetic mutations within surfactant-producing genes.",

                fullLO: "LO3: Describe the different pathophysiologies",
                question: "A 55-year-old woman develops ARDS following severe pneumonia. Her hypoxemia is profound. Which of the following best describes the primary pathophysiology driving her lung injury and subsequent impaired gas exchange?",

        // --- Core Logic ---
        const quizRoot = document.getElementById('quiz-root');
        const themeSelect = document.getElementById('theme-select');
        const pinBtn = document.getElementById('pin-btn');
        const mainHeader = document.getElementById('main-header');
        const sectionNav = document.getElementById('section-nav');

        function initQuiz() {
            // Render Questions
            let currentSection = "";
            let sectionIndex = 0;
            
            quizData.forEach((item, index) => {
                // Insert Section Header if needed
                if (item.section !== currentSection) {
                    currentSection = item.section;
                    
                    // Create ID for scrolling
                    const sectionId = 'sec-' + sectionIndex;
                    
                    // Add Section Header
                    const sectionHeader = document.createElement('h2');
                    sectionHeader.className = 'section-header';
                    sectionHeader.id = sectionId;
                    sectionHeader.textContent = currentSection;
                    quizRoot.appendChild(sectionHeader);

                    // Add Nav Button dynamically
                    const navBtn = document.createElement('button');
                    // Abbreviate longer titles for the buttons if desired, or keep as is.
                    let btnText = currentSection;
                    if (btnText.includes("Pathology of Vascular")) btnText = "Pathology of Vascular...";
                    if (btnText.includes("ARDS & Neonatal Respiratory Distress Syndrome")) btnText = "ARDS & Neonatal RDS";
                    
                    navBtn.textContent = btnText;
                    navBtn.onclick = () => {
                        document.getElementById(sectionId).scrollIntoView({ behavior: 'smooth' });
                    };
                    sectionNav.appendChild(navBtn);

                    sectionIndex++;
                }

                // Create Card
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-card-${index}`;

                // Learning Objective (Masked)
                const loBox = document.createElement('div');
                loBox.className = 'lo-box';
                loBox.id = `lo-${index}`;
                loBox.innerHTML = item.maskedLO;
                card.appendChild(loBox);

                // Question Text
                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.innerHTML = `${index + 1}. ${item.question}`;
                card.appendChild(qText);

                // Options Container
                const optionsGrid = document.createElement('div');
                optionsGrid.className = 'options-grid';

                for (const [key, value] of Object.entries(item.options)) {
                    const label = document.createElement('label');
                    label.className = 'option-label';
                    
                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = `question-${index}`;
                    input.value = key;

                    const span = document.createElement('span');
                    // Retain letters: A. Option Text
                    span.innerHTML = `${key}. ${value}`;

                    label.appendChild(input);
                    label.appendChild(span);
                    optionsGrid.appendChild(label);
                }
                card.appendChild(optionsGrid);

                // Check Button
                const btn = document.createElement('button');
                btn.className = 'btn-check';
                btn.textContent = 'Check Answer';
                btn.onclick = () => checkAnswer(index);
                card.appendChild(btn);

                // Feedback Container
                const feedback = document.createElement('div');
                feedback.className = 'feedback';
                feedback.id = `feedback-${index}`;
                card.appendChild(feedback);

                quizRoot.appendChild(card);
            });

            // Load saved theme
            const savedTheme = localStorage.getItem('quizTheme') || 'dark';
            changeTheme(savedTheme);
            themeSelect.value = savedTheme;

            // Load saved pin state
            const savedPinState = localStorage.getItem('headerPinned');
            // Default to true (pinned) if not set or if set to true
            if (savedPinState === 'false') {
                toggleHeader(false); 
            } else {
                toggleHeader(true);
            }
        }

        function checkAnswer(index) {
            const selected = document.querySelector(`input[name="question-${index}"]:checked`);
            const feedbackEl = document.getElementById(`feedback-${index}`);
            const loEl = document.getElementById(`lo-${index}`);
            const data = quizData[index];

            if (!selected) {
                alert("Please select an answer.");
                return;
            }

            // Reveal LO
            loEl.innerHTML = data.fullLO;

            // Generate Feedback HTML
            const isCorrect = selected.value === data.correctAnswer;
            
            let html = `<span class="feedback-header">${isCorrect ? "Correct!" : "Incorrect"}</span>`;
            if (!isCorrect) {
                html += `<div>The correct answer is <strong>${data.correctAnswer}</strong>.</div>`;
            }
            
            html += `<div class="rationale"><strong>Rationale:</strong> ${data.rationale}</div>`;
            html += `<div class="source"><strong>Source:</strong> ${data.source}</div>`;

            feedbackEl.innerHTML = html;
            feedbackEl.className = `feedback ${isCorrect ? 'correct' : 'incorrect'}`;
            feedbackEl.style.display = 'block';
        }

        function changeTheme(themeName) {
            document.documentElement.setAttribute('data-theme', themeName);
            localStorage.setItem('quizTheme', themeName);
        }

        function toggleHeader(forceState) {
            // Determine current state based on class presence
            const isCurrentlyPinned = !mainHeader.classList.contains('unpinned');
            
            // If forceState is provided (boolean), use it. Otherwise toggle current state.
            const newState = (typeof forceState === 'boolean') ? forceState : !isCurrentlyPinned;

            if (newState) {
                // Pin
                mainHeader.classList.remove('unpinned');
                pinBtn.classList.add('pin-active');
                localStorage.setItem('headerPinned', 'true');
            } else {
                // Unpin
                mainHeader.classList.add('unpinned');
                pinBtn.classList.remove('pin-active');
                localStorage.setItem('headerPinned', 'false');
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', initQuiz);

    </script>
